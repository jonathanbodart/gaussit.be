<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss in the Shell</title>
<meta name="description" content="Solution architecture, applied AI and digital compliance.">
<meta name="theme-color" content="#0B1A2E">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<style>
  @font-face { font-family: "Space Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/space-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/space-grotesk-latin-600-normal.woff2") format("woff2"); }
  :root { --ink: #0B1A2E; --accent: #22D3EE; --text: #E6EDF5; --muted: #A3B3C6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--ink); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 32px; padding: 48px 24px; text-align: center; }
  h1 { margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 400; font-size: clamp(28px, 5vw, 46px); line-height: 1.2; letter-spacing: -0.01em; color: var(--text); text-wrap: balance; }
  h1 strong { font-weight: 600; color: var(--accent); }
  img { width: min(320px, 70vw); height: auto; }
  .tagline { margin: 0; font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 15px; color: var(--muted); }
  .tagline::before { content: "> "; color: var(--accent); }
  .contact { margin: 0; font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 15px; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(34,211,238,.4); }
  a:hover, a:focus-visible { border-bottom-color: var(--accent); }
  footer { padding: 20px 24px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <img src="gits-lockup-white.svg" alt="Gauss in the Shell">
    <h1>Elevate your Digital Services,<br>Stand out of the <strong>norm</strong></h1>
    <p class="tagline">Solution&nbsp;architecture · Applied&nbsp;AI · Digital&nbsp;compliance</p>
    <p class="contact"><a href="mailto:jonathan@gaussit.be">jonathan@gaussit.be</a> · <a href="https://www.linkedin.com/in/jonathanbodart">LinkedIn</a></p>
  </main>
  <footer>Gauss In The Shell BV (in oprichting)</footer>
</body>
</html>
